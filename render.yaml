services:
  - type: web
    name: hr-system
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "from flask_app import app, init_db; app.app_context().push(); init_db()"
    startCommand: gunicorn flask_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
